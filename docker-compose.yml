services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: edusync
      POSTGRES_USER: edusync
      POSTGRES_PASSWORD: edusync
    ports:
      - "5432:5432"
    volumes:
      - edusync_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusync -d edusync"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://edusync:edusync@db:5432/edusync
      JWT_SECRET: change-me-in-local-env
      AUTH_DISABLED: "true"
      STORAGE_DIR: ./storage
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
volumes:
  edusync_db:
